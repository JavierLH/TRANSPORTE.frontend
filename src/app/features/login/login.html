<img class="fondo" src="Recurso 24x2.png" alt="Descripción de la imagen" />

<div class="login-wrapper">
  <div class="login-header"></div>

  <div class="login-card">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="iniciarSesion()"
      class="form-container"
    >
      <div class="input-group">
        <label for="username">Usuario</label>
        <input pInputText id="username" type="text" formControlName="usuario" />
      </div>

      <div class="input-group">
        <div class="password-labels">
          <label for="password">Contraseña</label>
        </div>
        <input
          pInputText
          id="password"
          type="password"
          formControlName="contrasena"
        />
      </div>

      <div class="input-group"></div>

      <div *ngIf="mensajeError" class="alert error-message">
        <i class="pi pi-exclamation-circle"></i> {{ mensajeError }}
      </div>

      <div *ngIf="mensajeExito" class="alert success-message">
        <i class="pi pi-check-circle"></i> {{ mensajeExito }}
      </div>

      <p-button
        label="Iniciar sesión"
        type="submit"
        styleClass="w-full btn-login"
      ></p-button>

      <a href="#" class="link-action forgot-password">Administrador</a>
    </form>
  </div>
</div>
