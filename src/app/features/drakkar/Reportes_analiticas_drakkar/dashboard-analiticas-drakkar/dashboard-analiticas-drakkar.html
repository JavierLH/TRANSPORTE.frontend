<!-- Separación por eje: gap-x entre columnas, gap-y entre renglones. -->
<div class="grid grid-cols-2 gap-x-3 gap-y-1 p-3">
  <app-comparativa-anual
    empresa="Autotransportes Drakkar"
    temaEmpresa="drakkar"
    [datosPorAnio]="datosPorAnio"
    [cargando]="cargando"
    [anioInicial]="2022"
    [anioFinal]="2022"
    [mostrarEncabezado]="false"
    [coloresPorDefecto]="[
      '--p-blue-500',
      '--p-sky-400',
      '--p-indigo-600',
      '--p-cyan-300',
      '--p-blue-800',
      '--p-violet-500',
      '--p-sky-700',
      '--p-indigo-300',
    ]"
    [alturaGrafica]="'25rem'"
  ></app-comparativa-anual>

  <!-- Trae sus propios datos: no recibe datosPorAnio. Sin [anio] usa el actual. -->
  <app-contenedores-comparativa-anual
    empresa="Autotransportes Drakkar"
    temaEmpresa="drakkar"
    [prefijos]="['40', '41']"
    [mostrarEncabezado]="false"
    [coloresPorDefecto]="[
      '--p-blue-500',
      '--p-sky-400',
      '--p-indigo-600',
      '--p-cyan-300',
      '--p-blue-800',
      '--p-violet-500',
      '--p-sky-700',
      '--p-indigo-300',
    ]"
    [alturaGrafica]="'25rem'"
  ></app-contenedores-comparativa-anual>

  <!-- Igual que la de contenedores: trae sus propios datos y sin [anio] usa el actual. -->
  <app-mercancias-comparativa-anual
    empresa="Autotransportes Drakkar"
    temaEmpresa="drakkar"
    [prefijos]="['40', '41']"
    [mostrarEncabezado]="false"
    [coloresPorDefecto]="[
      '--p-blue-500',
      '--p-sky-400',
      '--p-indigo-600',
      '--p-cyan-300',
      '--p-blue-800',
    ]"
    [alturaGrafica]="'25rem'"
  ></app-mercancias-comparativa-anual>
</div>
