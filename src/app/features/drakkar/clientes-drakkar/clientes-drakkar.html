<p-toast></p-toast>

<div class="card">
  <p-table
    #dt
    [value]="tablaClientes"
    [loading]="cargando"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [globalFilterFields]="['nombreCliente']"
    [tableStyle]="{ 'min-width': '40rem' }"
    dataKey="idCliente"
  >
    <ng-template pTemplate="caption">
      <div class="tabla-header">
        <span class="titulo">Clientes - DRAKKAR</span>

        <div class="grid-cols-3 p-1">
          <span class="p-input-icon-left">
            <i class="pi pi-search mr-2"></i>
            <input
              pInputText
              type="text"
              placeholder="Buscar cliente..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              class="mr-2"
            />
          </span>

          <button
            pButton
            type="button"
            label="Anexar nuevo cliente"
            icon="pi pi-plus"
            (click)="abrirAnexar()"
            class=""
          ></button>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th style="width: 6rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-cliente>
      <tr>
        <td>{{ cliente.nombreCliente }}</td>
        <td>
          <button
            pButton
            type="button"
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            (click)="editarCliente(cliente)"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" class="text-center p-4">
          No se encontraron clientes para esta empresa.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [header]="clienteSeleccionado ? 'Editar cliente' : 'Nuevo cliente'"
  [(visible)]="mostrarDialog"
  [modal]="true"
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '640px': '95vw' }"
  (onHide)="cerrarDialog()"
>
  <div class="grid-cols-2">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input pInputText id="nombre" [(ngModel)]="formNombre" class="w-full" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancelar"
      class="p-button-text"
      (click)="cerrarDialog()"
    ></button>
    <button
      pButton
      type="button"
      label="Guardar"
      icon="pi pi-save"
      (click)="guardarCliente()"
    ></button>
  </ng-template>
</p-dialog>

<p-dialog
  header="Anexar cliente del catálogo maestro"
  [(visible)]="mostrarDialogAnexar"
  [modal]="true"
  [style]="{ width: '48rem' }"
  [breakpoints]="{ '800px': '95vw' }"
>
  <p-table
    #dtMaestros
    [value]="maestrosDisponibles"
    [loading]="cargandoMaestros"
    [paginator]="true"
    [rows]="10"
    [globalFilterFields]="['razonSocial', 'rfc']"
    dataKey="idClienteMaestro"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="caption">
      <span class="p-input-icon-left">
        <i class="pi pi-search mr-2"></i>
        <input
          pInputText
          type="text"
          placeholder="Buscar por nombre o RFC..."
          (input)="dtMaestros.filterGlobal($any($event.target).value, 'contains')"
        />
      </span>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>Razón social</th>
        <th style="width: 10rem">RFC</th>
        <th style="width: 8rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-maestro>
      <tr>
        <td>{{ maestro.razonSocial }}</td>
        <td>{{ maestro.rfc ?? '—' }}</td>
        <td>
          <button
            pButton
            type="button"
            label="Anexar"
            icon="pi pi-link"
            class="p-button-sm"
            [loading]="anexandoId === maestro.idClienteMaestro"
            [disabled]="anexandoId !== null"
            (click)="anexarCliente(maestro)"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-4">
          No hay clientes por anexar: esta empresa ya tiene todos los del catálogo maestro.
        </td>
      </tr>
    </ng-template>
  </p-table>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cerrar"
      class="p-button-text"
      (click)="cerrarAnexar()"
    ></button>
  </ng-template>
</p-dialog>
