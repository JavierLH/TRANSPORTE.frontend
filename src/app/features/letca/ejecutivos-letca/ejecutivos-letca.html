<p-toast></p-toast>

<div class="card">
  <p-table
    #dt
    [value]="tablaEjecutivos"
    [loading]="cargando"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [globalFilterFields]="['nombreEjecutivo']"
    [tableStyle]="{ 'min-width': '40rem' }"
    dataKey="idEjecutivo"
  >
    <ng-template pTemplate="caption">
      <div class="tabla-header">
        <span class="titulo">Ejecutivos - LETCA</span>

        <div class="grid-cols-3 p-1">
          <span class="p-input-icon-left">
            <i class="pi pi-search mr-2"></i>
            <input
              pInputText
              type="text"
              placeholder="Buscar ejecutivo..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              class="mr-2"
            />
          </span>

          <button
            pButton
            type="button"
            label="Nuevo ejecutivo"
            icon="pi pi-plus"
            (click)="nuevoEjecutivo()"
            class=""
          ></button>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Estatus</th>
        <th style="width: 6rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-ejecutivo>
      <tr>
        <td>{{ ejecutivo.nombreEjecutivo }}</td>
        <td>
          <p-tag
            [value]="ejecutivo.activo ? 'Habilitado' : 'Deshabilitado'"
            [severity]="ejecutivo.activo ? 'success' : 'secondary'"
          ></p-tag>
        </td>
        <td>
          <button
            pButton
            type="button"
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            (click)="editarEjecutivo(ejecutivo)"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-4">
          No se encontraron ejecutivos para esta empresa.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [header]="ejecutivoSeleccionado ? 'Editar ejecutivo' : 'Nuevo ejecutivo'"
  [(visible)]="mostrarDialog"
  [modal]="true"
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '640px': '95vw' }"
  (onHide)="cerrarDialog()"
>
  <div class="grid-cols-2">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input pInputText id="nombre" [(ngModel)]="formNombre" class="w-full" />
    </div>

    <div class="mt-2 grid-cols-2 p-2">
      <label for="habilitado">Habilitado</label>
      <p-toggleswitch
        id="habilitado"
        [(ngModel)]="formHabilitado"
      ></p-toggleswitch>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancelar"
      class="p-button-text"
      (click)="cerrarDialog()"
    ></button>
    <button
      pButton
      type="button"
      label="Guardar"
      icon="pi pi-save"
      (click)="guardarEjecutivo()"
    ></button>
  </ng-template>
</p-dialog>
