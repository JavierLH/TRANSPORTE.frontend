<div
  class="flex flex-col h-screen w-[300px] box-border border-r border-gray-200 bg-white"
>
  <div class="py-4 px-3 text-emerald-600">
    <span class="text-lg font-bold">{{ nombre }}</span>
  </div>

  <div
    class="grow overflow-y-auto"
    #scrollContainer
    (scroll)="onScroll($event)"
  >
    <p-panelMenu
      [model]="items"
      [multiple]="true"
      styleClass="w-full"
      [pt]="{
        panel: { class: 'border-1',  },
        
      }"
    ></p-panelMenu>
  </div>

  <button
    class="flex items-center w-full p-3 border-0 border-t border-gray-200 bg-transparent text-left cursor-pointer hover:bg-gray-50"
  >
    <p-avatar image="..." shape="circle" class="mr-2"></p-avatar>
    <div class="flex flex-col">
      <span class="font-bold text-sm text-gray-800">{{ nombre }}</span>
      <span class="text-xs text-gray-500">Admin</span>
    </div>
  </button>
</div>
