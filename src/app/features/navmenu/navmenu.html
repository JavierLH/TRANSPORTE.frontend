<div
  class="flex flex-col h-screen box-border border-r border-gray-200 bg-white overflow-hidden transition-[width] duration-200 ease-in-out"
  [ngClass]="colapsado ? 'w-[64px]' : 'w-[300px]'"
>
  <!-- Encabezado: el botón queda siempre visible para poder reabrir el menú;
       el nombre sólo aparece cuando está expandido. -->
  <div
    class="flex items-center gap-2.5 py-3.5 px-3.5 text-emerald-600 border-b border-gray-100"
    [ngClass]="colapsado ? 'justify-center' : ''"
  >
    <!-- La marca se oculta al colapsar: ahí sólo queda el botón, centrado. -->
    <div
      *ngIf="!colapsado"
      class="flex items-center justify-center w-7 h-7 shrink-0 rounded-lg bg-emerald-700"
    >
      <i class="pi pi-truck text-white text-sm"></i>
    </div>

    <span *ngIf="!colapsado" class="text-base font-semibold tracking-wide whitespace-nowrap">
      SIIL
    </span>

    <button
      type="button"
      class="flex items-center justify-center w-8 h-8 shrink-0 border-0 rounded bg-transparent text-gray-400 cursor-pointer hover:bg-gray-100 hover:text-gray-600"
      [ngClass]="colapsado ? '' : 'ml-auto'"
      [attr.aria-label]="colapsado ? 'Abrir menú' : 'Ocultar menú'"
      [attr.aria-expanded]="!colapsado"
      (click)="alternarMenu()"
    >
      <i
        class="pi"
        [ngClass]="colapsado ? 'pi-bars' : 'pi-angle-double-left'"
      ></i>
    </button>
  </div>

  <!-- Se oculta con la clase `hidden` y no con *ngIf para que #scrollContainer
       siga existiendo y no se pierda la posición del scroll al colapsar. -->
  <div
    class="grow overflow-y-auto"
    [class.hidden]="colapsado"
    #scrollContainer
    (scroll)="onScroll($event)"
  >
    <!-- Sin `pt`: el `border-1` que llevaba aquí era lo que convertía cada
         módulo en una tarjeta. El estilo de las filas está en navmenu.css. -->
    <p-panelMenu
      [model]="items"
      [multiple]="true"
      styleClass="w-full"
    ></p-panelMenu>
  </div>

  <!-- Empuja el pie hacia abajo mientras el menú está colapsado, ya que el
       contenedor con `grow` está en display:none. -->
  <div *ngIf="colapsado" class="grow"></div>

  <div
    class="flex border-t border-gray-100 bg-gray-50/60"
    [ngClass]="colapsado ? 'flex-col' : 'flex-row items-center'"
  >
    <button
      class="flex items-center flex-1 p-3 border-0 bg-transparent text-left cursor-pointer hover:bg-gray-100 min-w-0"
      [ngClass]="colapsado ? 'justify-center' : ''"
    >
      <p-avatar
        image="..."
        shape="circle"
        [ngClass]="colapsado ? '' : 'mr-2'"
      ></p-avatar>

      <div *ngIf="!colapsado" class="flex flex-col min-w-0">
        <span class="font-bold text-sm text-gray-800 truncate">{{ nombre }}</span>
        <span class="text-xs text-gray-500">Admin</span>
      </div>
    </button>

    <button
      type="button"
      class="flex items-center justify-center w-11 h-11 shrink-0 border-0 bg-transparent text-red-500 cursor-pointer hover:bg-red-50"
      [ngClass]="colapsado ? '' : 'mr-1'"
      pTooltip="Cerrar sesión"
      tooltipPosition="right"
      [attr.aria-label]="'Cerrar sesión'"
      (click)="cerrarSesion()"
    >
      <i class="pi pi-sign-out"></i>
    </button>
  </div>
</div>
