<div
  class="flex flex-col h-screen box-border border-r border-gray-200 bg-white overflow-hidden transition-[width] duration-200 ease-in-out"
  [ngClass]="colapsado ? 'w-[64px]' : 'w-[300px]'"
>
  <!-- Encabezado: el botón queda siempre visible para poder reabrir el menú;
       el nombre sólo aparece cuando está expandido. -->
  <div
    class="flex items-center gap-2 py-4 px-3 text-emerald-600"
    [ngClass]="colapsado ? 'justify-center' : ''"
  >
    <button
      type="button"
      class="flex items-center justify-center w-9 h-9 shrink-0 border-0 rounded bg-transparent text-emerald-600 cursor-pointer hover:bg-gray-100"
      [attr.aria-label]="colapsado ? 'Abrir menú' : 'Ocultar menú'"
      [attr.aria-expanded]="!colapsado"
      (click)="alternarMenu()"
    >
      <i class="pi" [ngClass]="colapsado ? 'pi-bars' : 'pi-angle-double-left'"></i>
    </button>

    <span *ngIf="!colapsado" class="text-lg font-bold whitespace-nowrap">
      {{ nombre }}
    </span>
  </div>

  <!-- Se oculta con la clase `hidden` y no con *ngIf para que #scrollContainer
       siga existiendo y no se pierda la posición del scroll al colapsar. -->
  <div
    class="grow overflow-y-auto"
    [class.hidden]="colapsado"
    #scrollContainer
    (scroll)="onScroll($event)"
  >
    <p-panelMenu
      [model]="items"
      [multiple]="true"
      styleClass="w-full"
      [pt]="{
        panel: { class: 'border-1',  },

      }"
    ></p-panelMenu>
  </div>

  <!-- Empuja el pie hacia abajo mientras el menú está colapsado, ya que el
       contenedor con `grow` está en display:none. -->
  <div *ngIf="colapsado" class="grow"></div>

  <button
    class="flex items-center w-full p-3 border-0 border-t border-gray-200 bg-transparent text-left cursor-pointer hover:bg-gray-50"
    [ngClass]="colapsado ? 'justify-center' : ''"
  >
    <p-avatar
      image="..."
      shape="circle"
      [ngClass]="colapsado ? '' : 'mr-2'"
    ></p-avatar>

    <div *ngIf="!colapsado" class="flex flex-col">
      <span class="font-bold text-sm text-gray-800">{{ nombre }}</span>
      <span class="text-xs text-gray-500">Admin</span>
    </div>
  </button>
</div>
