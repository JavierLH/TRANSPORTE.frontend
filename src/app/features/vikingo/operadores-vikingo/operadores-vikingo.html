<p-toast></p-toast>

<div class="card">
  <p-table
    #dt
    [value]="tablaOperadores"
    [loading]="cargando"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [globalFilterFields]="['nombreOperador']"
    [tableStyle]="{ 'min-width': '40rem' }"
    dataKey="idOperador"
  >
    <ng-template pTemplate="caption">
      <div class="tabla-header">
        <span class="titulo">Operadores - VIKINGO</span>

        <div class="grid-cols-3 p-1">
          <span class="p-input-icon-left">
            <i class="pi pi-search mr-2"></i>
            <input
              pInputText
              type="text"
              placeholder="Buscar operador..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              class="mr-2"
            />
          </span>

          <button
            pButton
            type="button"
            label="Nuevo operador"
            icon="pi pi-plus"
            (click)="nuevoOperador()"
          ></button>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Estatus</th>
        <th style="width: 6rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-operador>
      <tr>
        <td>{{ operador.nombreOperador }}</td>
        <td>
          <p-tag
            [value]="operador.estatus === 1 ? 'Activo' : 'Inactivo'"
            [severity]="operador.estatus === 1 ? 'success' : 'secondary'"
          ></p-tag>
        </td>
        <td>
          <button
            pButton
            type="button"
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            (click)="editarOperador(operador)"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-4">
          No se encontraron operadores para esta empresa.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [header]="operadorSeleccionado ? 'Editar operador' : 'Nuevo operador'"
  [(visible)]="mostrarDialog"
  [modal]="true"
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '640px': '95vw' }"
  (onHide)="cerrarDialog()"
>
  <div class="grid-cols-2">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input
        pInputText
        id="nombre"
        [(ngModel)]="formNombre"
        class="w-full"
        maxlength="100"
      />
    </div>

    <div class="mt-2 grid-cols-2 p-2">
      <label for="activo">Activo</label>
      <p-toggleswitch id="activo" [(ngModel)]="formActivo"></p-toggleswitch>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancelar"
      class="p-button-text"
      [disabled]="guardando"
      (click)="cerrarDialog()"
    ></button>
    <button
      pButton
      type="button"
      label="Guardar"
      icon="pi pi-save"
      [loading]="guardando"
      (click)="guardarOperador()"
    ></button>
  </ng-template>
</p-dialog>
