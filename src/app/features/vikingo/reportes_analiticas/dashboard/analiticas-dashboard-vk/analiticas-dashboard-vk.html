<div class="grid grid-cols-2 p-[1%]">
  <app-comparativa-anual
    empresa="Autotransportes Vikingo"
    temaEmpresa="vikingo"
    [datosPorAnio]="datosPorAnio"
    [cargando]="cargando"
    [anioInicial]="2022"
    [anioFinal]="2022"
    [mostrarEncabezado]="false"
    [coloresPorDefecto]="[
      '--p-red-500',
      '--p-orange-400',
      '--p-rose-600',
      '--p-amber-300',
      '--p-red-800',
      '--p-pink-500',
      '--p-orange-700',
      '--p-rose-300',
    ]"
  ></app-comparativa-anual>

  <!-- Trae sus propios datos: no recibe datosPorAnio. Sin [anio] usa el actual. -->
  <app-contenedores-comparativa-anual
    empresa="Autotransportes Vikingo"
    temaEmpresa="vikingo"
    [prefijos]="['31', '32', '33', '34']"
    [mostrarEncabezado]="false"
    [coloresPorDefecto]="[
      '--p-red-500',
      '--p-orange-400',
      '--p-rose-600',
      '--p-amber-300',
      '--p-red-800',
      '--p-pink-500',
      '--p-orange-700',
      '--p-rose-300',
    ]"
  ></app-contenedores-comparativa-anual>
</div>
